name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public Firebase web config (identifies the project; protected by App Check, not by secrecy).
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}

jobs:
  quality:
    name: "1 · Lint, types, unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    name: "2 · Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit (high and critical block)
        run: npm audit --audit-level=high

  build:
    name: "3 · Static export + bundle budget"
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Firebase web config present (repository variables)
        run: |
          for v in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_APP_ID NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is empty. Set it under Settings > Secrets and variables > Actions > Variables (see CONTRIBUTING.md)"; exit 1; }
          done
      - run: npm run build
      - name: Bundle budget (static assets, KB on disk)
        run: |
          KB=$(du -sk out/_next/static | cut -f1)
          echo "static assets: ${KB} KB (measured 1520 KB when this budget was set)"
          [ "$KB" -le 1800 ] || { echo "::error::static assets ${KB} KB exceed the 1800 KB budget"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 3

  e2e:
    name: "4 · Playwright E2E (static export)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out/
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  perf:
    name: "5 · Lighthouse budgets"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out/
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  gate:
    name: "6 · Gate summary"
    needs: [quality, security, build, e2e, perf]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All five stages green for this commit. Vercel deploys main independently; make this check required in branch protection to turn it into a real gate."
