<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
  <title id="t">Pastewise architecture</title>
  <desc id="d">Your pasted text goes through a schema built from the live form to Gemini Nano on the laptop, then through a code gate that keeps a value only if it appears in the paste. Only the empty form structure goes to the Firebase AI Logic cloud model, protected by App Check, with Remote Config and Firestore beside it. An egress ledger watches every network call.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2433"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B3D9C"/></marker>
  </defs>
  <style>
    text{font-family:"Helvetica Neue",Arial,sans-serif;fill:#1F2433}
    .cap{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:700;letter-spacing:.14em;font-size:13px}
    .h{font-size:17px;font-weight:700}
    .s{font-size:13.5px}
    .m{font-size:12px;fill:#6E5A55}
    .box{fill:#FFFDF8;stroke:#C49C93;stroke-width:2}
  </style>
  <rect width="1000" height="540" fill="#F4DCD6"/>
  <!-- laptop -->
  <rect x="24" y="24" width="640" height="420" fill="none" stroke="#1F2433" stroke-width="2.5"/>
  <text x="40" y="50" class="cap">YOUR LAPTOP · CHROME DESKTOP · STATIC PAGE, NO PASTEWISE SERVER</text>
  <rect class="box" x="44" y="74" width="170" height="86"/>
  <text x="58" y="100" class="h">Your paste</text>
  <text x="58" y="121" class="s">a messy order</text>
  <text x="58" y="139" class="s">message</text>
  <rect class="box" x="44" y="206" width="170" height="86"/>
  <text x="58" y="232" class="h">Schema</text>
  <text x="58" y="253" class="s">built from the live</text>
  <text x="58" y="271" class="s">form's boxes</text>
  <rect class="box" x="264" y="140" width="190" height="110"/>
  <text x="278" y="166" class="h">Gemini Nano</text>
  <text x="278" y="188" class="s">AI Logic</text>
  <text x="278" y="206" class="s" font-family="Menlo,monospace" font-size="12.5">ONLY_ON_DEVICE</text>
  <text x="278" y="228" class="m">no cloud params at all</text>
  <rect x="504" y="140" width="140" height="110" fill="#FFFDF8" stroke="#2B3D9C" stroke-width="3"/>
  <text x="518" y="166" class="h" style="fill:#2B3D9C">Code gate</text>
  <text x="518" y="188" class="s">value kept only if</text>
  <text x="518" y="206" class="s">it is in the paste</text>
  <text x="518" y="224" class="s">and fits the format</text>
  <rect x="504" y="290" width="62" height="40" fill="#F4DCD6" stroke="#2B3D9C" stroke-width="3"/>
  <text x="514" y="315" class="s" style="fill:#2B3D9C;font-weight:700">blue</text>
  <rect x="582" y="290" width="62" height="40" fill="#FBE6BE" stroke="#B86A00" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="590" y="315" class="s" style="fill:#B86A00;font-weight:700">amber</text>
  <text x="504" y="352" class="m">found in your text → blue</text>
  <text x="504" y="368" class="m">anything else → amber</text>
  <!-- ledger -->
  <rect x="44" y="392" width="600" height="38" fill="#FFFDF8" stroke="#1F2433" stroke-width="2" stroke-dasharray="2 0"/>
  <text x="58" y="416" class="cap" style="font-size:12px">EGRESS LEDGER · wraps fetch, XHR, sendBeacon, WebSocket · paste words found in any request: 0</text>
  <!-- arrows laptop -->
  <path d="M129 160V204" stroke="#1F2433" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <path d="M214 249H262" stroke="#1F2433" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <path d="M214 117H300V138" stroke="#1F2433" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <path d="M454 195H502" stroke="#1F2433" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
  <path d="M574 252V288" stroke="#2B3D9C" stroke-width="2.2" fill="none" marker-end="url(#b)"/>
  <!-- firebase -->
  <rect x="716" y="24" width="260" height="420" fill="none" stroke="#1F2433" stroke-width="2.5"/>
  <text x="730" y="50" class="cap">FIREBASE · FREE TIER</text>
  <rect class="box" x="736" y="74" width="220" height="104"/>
  <text x="750" y="100" class="h">AI Logic · cloud</text>
  <text x="750" y="121" class="s" font-family="Menlo,monospace" font-size="12.5">ONLY_IN_CLOUD</text>
  <text x="750" y="142" class="s">"form teacher": writes hints</text>
  <text x="750" y="160" class="s">for cryptic boxes</text>
  <rect class="box" x="736" y="198" width="220" height="56"/>
  <text x="750" y="222" class="h">App Check</text>
  <text x="750" y="241" class="s">reCAPTCHA Enterprise</text>
  <rect class="box" x="736" y="274" width="220" height="56"/>
  <text x="750" y="298" class="h">Remote Config</text>
  <text x="750" y="317" class="s">cap, timeout, kill switch</text>
  <rect class="box" x="736" y="350" width="220" height="74"/>
  <text x="750" y="374" class="h">Firestore</text>
  <text x="750" y="393" class="s">saved hints per form shape</text>
  <text x="750" y="411" class="m">structure only, read-only</text>
  <!-- cloud arrow: empty form only -->
  <path d="M214 232H236V84H734" stroke="#1F2433" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="352" y="76" class="s" font-weight="700">only the EMPTY form (labels, names, options)</text>
  <!-- never -->
  <path d="M470 118H690" stroke="#B86A00" stroke-width="2.4" fill="none" stroke-dasharray="3 4"/>
  <text x="474" y="106" class="s" style="fill:#B86A00;font-weight:700">your pasted text → cloud: never</text>
  <text x="44" y="480" class="s">No Nano on this laptop? A plain notice appears and the one paste goes to the cloud (PREFER_ON_DEVICE) only after you press Yes.</text>
  <text x="44" y="502" class="s">Every fill shows the inferenceSource Firebase AI Logic reports for it.</text>
</svg>
