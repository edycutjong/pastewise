<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pastewise — fills the form from your paste, on your laptop. Boxes press through in carbon blue; one phone number stays amber. Text from your paste sent to the cloud: 0 bytes found.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: the resolved mark = the static icon: blue underlines on the top sheet, blue values in boxes 1-2, box 3 amber dashed (poster = a complete still; the seam returns here)
  10-16%  the copy is cleared for the next message: underlines retract, values and the amber box fade
  17-32%  trigger:      a reading band sweeps down the top sheet — the message is read on this laptop      data-story="beat-2"
  36-60%  mechanism:    Boxes press through in carbon blue; one phone number stays amber. Text from your paste sent to the cloud: 0 bytes found.      data-story="beat-3"
                        (underline draws under a source line → its value presses into box 1 in carbon blue; again for box 2; box 3 turns amber dashed and stays)
  64-90%  resolution:   pressed values breathe a carbon glow      data-story="beat-4"
  90-100% breathe: the resolved state holds into the seam (100% = 0%, so no seam fade is needed)
-->
<title>Pastewise</title>
<style>
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><filter id="m-glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="9"/></filter></defs>
