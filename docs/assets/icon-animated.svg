<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pastewise — fills the form from your paste, on your laptop. Boxes press through in carbon blue; one phone number stays amber. Text from your paste sent to the cloud: 0 bytes found.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: navy plate, white top sheet with grey message lines, pink copy with three empty ruled boxes (poster = the mark, nothing half-drawn)
  10-25%  trigger:      a reading band sweeps down the top sheet — the message is read on this laptop      data-story="beat-2"
  25-55%  mechanism:    Boxes press through in carbon blue; one phone number stays amber. Text from your paste sent to the cloud: 0 bytes found.      data-story="beat-3"
                        (underline draws under a source line → its value presses into box 1 in carbon blue; again for box 2; box 3 turns amber dashed and stays)
  55-80%  resolution:   pressed values breathe a carbon glow; underlines, blue values and the amber box persist      data-story="beat-4"
  80-100% breathe + seam fade (story layer 0.96 → 1.00 back to the poster)
-->
<title>Pastewise</title>
<style>
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
